version: '3.8'

services:
  v8-dev:
    build: .
    ports:
      # SSH is published on the loopback interface only (reach it with
      # `ssh vscode@localhost -p 2222`). Use "2222:22" to expose it on the network.
      - "127.0.0.1:2222:22"
    volumes:
      - v8-volume:/home/vscode/v8
    environment:
      - PASSWORD=vscode

volumes:
  v8-volume: