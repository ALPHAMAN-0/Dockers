services:
  wordpress:
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: CHANGE_THIS_PASSWORD   # <- change me
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: CHANGE_THIS_PASSWORD          # <- same as above
      MYSQL_ROOT_PASSWORD: CHANGE_THIS_ROOT_PASSWORD # <- change me too
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wordpress_data:
  db_data: